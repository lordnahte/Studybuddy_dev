<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyBuddy — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #EEF3F1;
        --surface: #FFFFFF;
        --ink: #21313A;
        --ink-soft: #5B6B70;
        --brand: #2F6F5E;
        --brand-dark: #234F42;
        --accent: #E7A445;
        --border: #D8E4DF;
        --danger: #B84A3B;
        --danger-bg: #FBEAE7;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Inter', Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
    }

    body::before, body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        pointer-events: none;
    }
    body::before { width: 520px; height: 520px; top: -220px; left: -180px; }
    body::after { width: 360px; height: 360px; bottom: -160px; right: -140px; }

    .login-box {
        position: relative;
        background: var(--surface);
        padding: 2.75rem 2.25rem 2.25rem;
        border-radius: 14px;
        box-shadow: 0 20px 40px -20px rgba(35, 79, 66, 0.25);
        width: 320px;
        text-align: center;
        border: 1px solid var(--border);
    }

    .mark {
        width: 40px;
        height: 40px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        background: conic-gradient(var(--brand) 0deg 270deg, var(--accent) 270deg 360deg);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .mark span {
        width: 26px;
        height: 26px;
        background: var(--surface);
        border-radius: 50%;
    }

    h2 {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
        letter-spacing: -0.01em;
    }

    .tagline {
        color: var(--ink-soft);
        font-size: 0.85rem;
        margin: 0 0 1.5rem;
    }

    label {
        display: block;
        text-align: left;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0.85rem 0 0.3rem;
    }

    input {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #FBFDFC;
        font-family: 'Inter', Arial, sans-serif;
        font-size: 0.95rem;
        color: var(--ink);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(47, 111, 94, 0.15);
    }

    button {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Inter', Arial, sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        transition: background 0.15s ease, transform 0.05s ease;
    }
    button:active { transform: translateY(1px); }

    .btn-primary {
        background: var(--brand);
        color: #fff;
        margin-top: 1.5rem;
    }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-primary:disabled {
        background: #A9BEB6;
        cursor: not-allowed;
    }

    .link-btn {
        background: transparent;
        color: var(--brand);
        border: none;
        cursor: pointer;
        margin-top: 0.9rem;
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 2px;
    }
    .link-btn:hover { color: var(--brand-dark); }

    .message {
        display: none;
        margin-top: 1rem;
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        font-size: 0.82rem;
        text-align: left;
    }
    .message.error {
        display: block;
        background: var(--danger-bg);
        color: var(--danger);
    }
    .message.info {
        display: block;
        background: #EAF2EE;
        color: var(--brand-dark);
    }

    footer {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.78rem;
        margin-top: 1.5rem;
    }
</style>
</head>
<body>

<div>
    <div class="login-box">
        <div class="mark"><span></span></div>
        <h2>StudyBuddy</h2>
        <p class="tagline">Healthy study habits for Years 7–12</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>

            <button type="submit" id="submitBtn" class="btn-primary">Log in</button>
        </form>
        <button class="link-btn" id="toggleModeBtn">Create an account instead</button>

        <p id="message" class="message" role="status"></p>
    </div>
    <footer>&copy; 2026 StudyBuddy</footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
